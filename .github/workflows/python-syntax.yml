name: Python syntax check

on:
  pull_request:
  push:
    branches:
      - main
      - c4.2-live-signals-db

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile bot.py
        run: python -m py_compile bot.py
