name: Python checks

on:
  pull_request:
  push:
    branches:
      - main
      - c4.2-live-signals-db

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile bot.py and tests
        run: python -m py_compile bot.py tests/test_live_signal_validation.py
      - name: Run live signal unit tests
        run: python -m unittest discover -s tests -v
